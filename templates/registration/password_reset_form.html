{% extends 'base.html' %}

{% block title %}Reset Password | DevPulse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card-modern shadow-lg overflow-hidden border-0">
        <div class="bg-gradient p-4 text-center text-white" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4338ca 100%);">
          <div class="brand-icon-box mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
            <i class="fa-solid fa-key"></i>
          </div>
          <h3 class="font-heading fw-bold mb-1">Reset Password</h3>
          <p class="small text-white opacity-75 mb-0">Enter your email address to receive password reset instructions.</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
              <label for="{{ form.email.id_for_label }}" class="form-label font-heading fw-semibold text-dark small">Email Address</label>
              {{ form.email }}
            </div>

            <button type="submit" class="btn btn-primary-grad w-100 py-2.5 mb-3 shadow-md">
              <i class="fa-solid fa-paper-plane me-1.5"></i> Send Reset Link
            </button>

            <div class="text-center">
              <a href="{% url 'login' %}" class="small text-primary text-decoration-none fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Email Sent | DevPulse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-lg p-5 border-0">
        <i class="fa-solid fa-paper-plane text-success display-2 mb-3"></i>
        <h3 class="fw-bold mb-2">Reset Instructions Sent!</h3>
        <p class="text-muted mb-4">
          We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.
        </p>
        <div>
          <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4">Return to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

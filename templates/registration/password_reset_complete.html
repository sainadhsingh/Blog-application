{% extends 'base.html' %}

{% block title %}Password Reset Complete | DevPulse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-lg p-5 border-0">
        <i class="fa-solid fa-circle-check text-success display-2 mb-3"></i>
        <h3 class="fw-bold mb-2">Password Changed Successfully!</h3>
        <p class="text-muted mb-4">Your password has been updated. You may now log in with your new credentials.</p>
        <div>
          <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-5 py-2">Log In Now</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
